name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo fmt --manifest-path scripts/pillar/Cargo.toml --check
      - run: cargo clippy --manifest-path scripts/pillar/Cargo.toml --target wasm32-unknown-unknown --locked
      - run: cargo build --manifest-path scripts/pillar/Cargo.toml --target wasm32-unknown-unknown --release --locked
