[package]
name = "mineless"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
glam = { workspace = true, features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
sim = { path = "crates/sim" }
wgpu = "30"
winit = "0.30"

[lints]
workspace = true

[workspace]
members = ["crates/agent-api", "crates/sim"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
glam = "0.34"

[workspace.lints.clippy]
cast_lossless = "warn"
default_trait_access = "warn"
manual_midpoint = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
unwrap_used = "warn"

# Dependencies are rarely stepped through but decode the textures and drive the GPU every frame,
# so debug builds optimise them. Our own code is lightly optimised too: unoptimised, building the
# world before play took over 100 s instead of about 14. Debug info, debug assertions and overflow
# checks stay on.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
