[package]
name = "mineless"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.34", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
wgpu = "30"
winit = "0.30"
